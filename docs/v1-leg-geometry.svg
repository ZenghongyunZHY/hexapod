<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="764" viewBox="0 0 1000 764" role="img" aria-labelledby="title description">
  <title id="title">V1 单腿几何与屈膝站姿</title>
  <desc id="description">三段理想腿长、第二段的舵机轴距组成和屈膝站姿。数值来自 CAD 理想模型，图形和站姿角度仅作示意。</desc>
  <defs>
    <marker id="dim-arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#526c7e"/>
    </marker>
    <style>
      text { font-family: system-ui, "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #203c50; }
      .heading { font-size: 30px; font-weight: 700; }
      .panel-title { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; }
      .note { font-size: 16px; fill: #526c7e; }
      .joint { fill: #fff; stroke: #284758; stroke-width: 3; }
      .link { fill: none; stroke-width: 9; stroke-linecap: round; }
      .dim { fill: none; stroke: #526c7e; stroke-width: 1.5; marker-start: url(#dim-arrow); marker-end: url(#dim-arrow); }
      .tick { stroke: #9bafb9; stroke-width: 1.3; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="762" rx="23" fill="#f5f9fc" stroke="#dce6ed" stroke-width="2"/>
  <text class="heading" x="42" y="49">V1 单腿几何与屈膝站姿</text>
  <text class="note" x="43" y="78">运动学原理示意 · CAD 理想尺寸，单位 mm</text>

  <g id="unfolded-leg">
    <rect x="32" y="102" width="936" height="204" rx="15" fill="#fff" stroke="#dce6ed"/>
    <text class="panel-title" x="57" y="137">水平展开零位</text>
    <text class="note" x="943" y="137" text-anchor="end">舵机位置 500</text>
    <path d="M72 207h113" stroke="#8ba2af" stroke-width="3" stroke-dasharray="7 6"/>
    <path class="link" d="M185 207h140" stroke="#007b78"/>
    <path class="link" d="M325 207h233" stroke="#315c91"/>
    <path class="link" d="M558 207h327" stroke="#aa581f"/>
    <circle cx="72" cy="207" r="5" fill="#526c7e"/>
    <circle class="joint" cx="185" cy="207" r="8"/>
    <circle class="joint" cx="325" cy="207" r="8"/>
    <circle class="joint" cx="558" cy="207" r="8"/>
    <circle cx="885" cy="207" r="7" fill="#aa581f"/>
    <g class="label" text-anchor="middle">
      <text x="185" y="183">第一轴 · 偏航</text>
      <text x="325" y="183">第二轴 · 大腿</text>
      <text x="558" y="183">第三轴 · 膝</text>
      <text x="885" y="183">金属脚端</text>
    </g>
    <text class="note" x="66" y="233">固定安装变换</text>
    <path class="tick" d="M185 227v28m140-28v28m233-28v28m327-28v28"/>
    <path class="dim" d="M192 251h126"/>
    <path class="dim" d="M332 251h219"/>
    <path class="dim" d="M565 251h313"/>
    <g class="label" text-anchor="middle">
      <text x="255" y="280">L2 = 42.00</text>
      <text x="441" y="280">2 × L1 + d = 74.20</text>
      <text x="721" y="280">L3 = 112.53</text>
    </g>
  </g>

  <g id="second-link">
    <rect x="32" y="322" width="936" height="175" rx="15" fill="#fff" stroke="#dce6ed"/>
    <text class="panel-title" x="57" y="357">第二段轴距的组成</text>
    <rect x="245" y="381" width="190" height="36" rx="5" fill="#e0ebf6" stroke="#315c91" stroke-width="2"/>
    <rect x="565" y="381" width="190" height="36" rx="5" fill="#e0ebf6" stroke="#315c91" stroke-width="2"/>
    <path d="M435 399h130" stroke="#8ba2af" stroke-width="2" stroke-dasharray="6 5"/>
    <circle class="joint" cx="245" cy="399" r="7"/>
    <circle class="joint" cx="755" cy="399" r="7"/>
    <text class="note" x="217" y="405" text-anchor="end">第二轴</text>
    <text class="note" x="783" y="405">第三轴</text>
    <path class="tick" d="M245 423v24m190-24v24m130-24v24m190-24v24"/>
    <path class="dim" d="M252 443h176"/>
    <path class="dim" d="M442 443h116"/>
    <path class="dim" d="M572 443h176"/>
    <g class="label" text-anchor="middle">
      <text x="340" y="472">L1 = 30.50</text>
      <text x="500" y="472">d = 13.20</text>
      <text x="660" y="472">L1 = 30.50</text>
    </g>
  </g>

  <g id="standing-pose">
    <rect x="32" y="513" width="936" height="220" rx="15" fill="#fff" stroke="#dce6ed"/>
    <text class="panel-title" x="57" y="548">屈膝站姿侧视</text>
    <text class="note" x="943" y="548" text-anchor="end">角度和比例仅用于说明姿态</text>
    <rect x="143" y="605" width="104" height="28" rx="6" fill="#e7eff4" stroke="#8ba2af" stroke-width="2"/>
    <text class="note" x="195" y="594" text-anchor="middle">机身</text>
    <path class="link" d="M247 619h122" stroke="#007b78"/>
    <path class="link" d="M369 619 568 573" stroke="#315c91"/>
    <path class="link" d="M568 573 746 691" stroke="#aa581f"/>
    <path d="M132 691h710" stroke="#8ba2af" stroke-width="1.7" stroke-dasharray="6 5"/>
    <circle class="joint" cx="247" cy="619" r="8"/>
    <circle class="joint" cx="369" cy="619" r="8"/>
    <circle class="joint" cx="568" cy="573" r="8"/>
    <circle cx="746" cy="691" r="6" fill="#aa581f"/>
    <text class="label" x="460" y="580" text-anchor="middle">大腿上抬</text>
    <text class="label" x="699" y="604">小腿斜向落地</text>
    <text class="note" x="763" y="716">金属脚端</text>
  </g>
</svg>
